name: Android Dependencies Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

jobs:
  android-deps:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      GOEXPERIMENT: jsonv2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go 1.25.3
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.3'

      - name: Setup Android command-line tools
        shell: bash
        run: |
          set -euxo pipefail
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip" -o /tmp/cmdline-tools.zip
          unzip -q -o /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          rm -rf "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK/NDK/CMake packages
        shell: bash
        run: |
          set -euxo pipefail
          # sdkmanager exits before `yes` does, which trips pipefail with 141.
          (yes | sdkmanager --licenses >/dev/null) || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;26.3.11579264" \
            "cmake;3.22.1"

      - name: Export Android environment
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.3.11579264" >> "$GITHUB_ENV"
          echo "JAVA_HOME=${JAVA_HOME_17_X64:-$JAVA_HOME}" >> "$GITHUB_ENV"

      - name: Validate toolchain versions
        shell: bash
        run: |
          set -euxo pipefail
          go version
          java -version
          "$ANDROID_NDK_HOME/ndk-build" --version
          sdkmanager --version

      - name: Lock and verify modules
        shell: bash
        run: |
          set -euxo pipefail
          go mod download
          go mod verify

      - name: Compile deps for Android arm64
        shell: bash
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: '1'
          GOMAXPROCS: '1'
        run: |
          set -euxo pipefail
          export CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          export CXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++"
          go list -deps ./...
          go build -p 1 ./...

      - name: Compile deps for Android amd64
        shell: bash
        env:
          GOOS: android
          GOARCH: amd64
          CGO_ENABLED: '1'
          GOMAXPROCS: '1'
        run: |
          set -euxo pipefail
          export CC="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang"
          export CXX="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang++"
          go list -deps ./...
          go build -p 1 ./...
